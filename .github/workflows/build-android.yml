name: Build Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-android.yml'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev patchelf \
            build-essential python3-dev

      - name: Python and Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer==1.5.0' 'Cython<3'

      - name: Build a real debug APK (no release signing credentials)
        run: |
          # sdkmanager may prompt for Android SDK licenses in a headless runner.
          # Capture the Buildozer exit code (rather than treating the 'yes' pipe as success).
          set -uo pipefail
          set +e
          yes | buildozer -v android debug
          build_status=${PIPESTATUS[1]}
          set -e
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          test -n "$(find bin -maxdepth 1 -type f -name '*-debug.apk' -print -quit)"
          ls -lh bin/*-debug.apk

      - name: Upload only verified APK output
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*-debug.apk
          if-no-files-found: error
