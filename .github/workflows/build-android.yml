name: Build Android APK and AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  build-android:
    runs-on: ubuntu-22.04  # Daha yeni ve kararlı Ubuntu versiyonu
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # Daha güncel ve hızlı Python versiyonu
        
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential android-sdk-platform-tools-common android-tools-adb android-tools-fastboot
        
    - name: Set up Android SDK environment
      run: |
        sudo mkdir -p /usr/lib/android-sdk
        sudo chown -R $USER:$USER /usr/lib/android-sdk
        echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
        echo "PATH=/usr/lib/android-sdk/platform-tools:/usr/lib/android-sdk/tools:/usr/lib/android-sdk/tools/bin:$PATH" >> $GITHUB_ENV
        
    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
        
    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install buildozer
        pip install cython==0.29.33
        pip install kivy[base]
        
    - name: Initialize buildozer
      run: |
        mkdir -p ~/.buildozer
        buildozer init || echo "Buildozer already initialized"
        
    - name: Make buildozer directory
      run: mkdir -p ~/.buildozer
        
    - name: Build APK with detailed logging
      run: |
        buildozer android debug --verbose
      env:
        ANDROID_ACCEPT_SDK_LICENSE: 1
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-apk
        path: bin/*.apk
        
    - name: List built files
      if: always()
      run: |
        echo "Contents of bin directory:"
        ls -la bin/ || echo "bin directory not found"
        echo "Contents of current directory:"
        ls -la