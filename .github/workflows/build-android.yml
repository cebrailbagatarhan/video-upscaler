name: Validate Android project

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject tracked signing material and build artifacts
        run: python scripts/check_release_secrets.py

      - name: Compile Python sources
        run: python -m py_compile 1.py main.py video_upscaler_kivy.py scripts/check_release_secrets.py

      - name: Validate release shell script
        run: bash -n build_playstore.sh

      - name: Install image dependency
        run: python -m pip install 'Pillow>=9.1,<13.0'

      - name: Test aspect-ratio-preserving Lanczos resize
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps

          source = Image.new('RGB', (100, 50), 'red')
          result = ImageOps.contain(
              source,
              (200, 200),
              method=Image.Resampling.LANCZOS,
          )
          assert result.size == (200, 100)
          PY
