name: Validate Android project

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'SECURITY.md'
      - '.gitignore'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'SECURITY.md'
      - '.gitignore'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m compileall -q main.py

      - name: Reject committed build and signing artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked_artifacts="$(git ls-files '*.keystore' '*.jks' '*.apk' '*.aab')"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Tracked build/signing artifacts are forbidden:"
            echo "$tracked_artifacts"
            exit 1
          fi

      - name: Reject signing credentials in Buildozer config
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^[[:space:]]*android\.release_(keystore|keystore_passwd|key_alias|key_passwd)[[:space:]]*=' -- buildozer.spec; then
            echo "Release signing configuration must come from protected secrets."
            exit 1
          fi
