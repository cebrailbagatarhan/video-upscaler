name: Validate Android source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject tracked signing material and generated binaries
        run: python scripts/check_release_secrets.py

      - name: Compile Python sources
        run: python -m py_compile 1.py main.py video_upscaler_kivy.py scripts/check_release_secrets.py

      - name: Validate release shell script
        run: bash -n build_playstore.sh

