name: Build Android APK

on:
  workflow_dispatch:  # Sadece manuel trigger
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/**'

jobs:
  build-android:
    runs-on: ubuntu-latest  # En basit runner
    timeout-minutes: 60     # 1 saat timeout
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # Daha eski, stabil versiyon
      
    - name: Setup environment
      run: |
        echo "🚀 Starting APK build process..."
        echo "Repository: ${{ github.repository }}"
        echo "Commit: ${{ github.sha }}"
        
    - name: Create simple APK info
      run: |
        mkdir -p artifacts
        echo "Video Upscaler APK Build Info" > artifacts/build_info.txt
        echo "Build Date: $(date)" >> artifacts/build_info.txt
        echo "Commit: ${{ github.sha }}" >> artifacts/build_info.txt
        echo "Repository: ${{ github.repository }}" >> artifacts/build_info.txt
        echo "" >> artifacts/build_info.txt
        echo "APK build requires specialized Android environment." >> artifacts/build_info.txt
        echo "Consider using:" >> artifacts/build_info.txt
        echo "1. Local WSL with buildozer" >> artifacts/build_info.txt
        echo "2. GitPod cloud environment" >> artifacts/build_info.txt
        echo "3. GitHub Codespaces" >> artifacts/build_info.txt
        
        # Proje dosyalarını da kopyalayalım
        cp main.py artifacts/ 2>/dev/null || echo "main.py not found"
        cp buildozer.spec artifacts/ 2>/dev/null || echo "buildozer.spec not found"
        
    - name: Upload build info
      uses: actions/upload-artifact@v3
      with:
        name: apk-build-info
        path: artifacts/