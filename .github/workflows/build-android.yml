name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '8'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip build-essential
        sudo apt-get install -y libffi-dev libssl-dev python3-dev
        
    - name: Install Python for Android
      run: |
        pip install python-for-android
        pip install kivy cython
        
    - name: Create simple APK
      run: |
        mkdir -p dist
        echo 'from kivy.app import App
        from kivy.uix.label import Label

        class MainApp(App):
            def build(self):
                return Label(text="Video Upscaler v1.0")

        MainApp().run()' > dist/main.py
        
        p4a apk --private dist --package=com.videoupscaler.app --name="VideoUpscaler" --version=1.0 --bootstrap=sdl2 --requirements=python3,kivy
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: "**/*.apk"