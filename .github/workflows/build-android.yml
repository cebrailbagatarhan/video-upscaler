name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget unzip build-essential ccache \
          libncurses5:i386 libstdc++6:i386 libgtk2.0-0:i386 \
          libpangox-1.0-0:i386 libpangoxft-1.0-0:i386 libidn11:i386 \
          python3-pip python3-dev python3-setuptools python3-venv \
          libtool libffi-dev libssl-dev autotools-dev automake cmake
        
    - name: Install buildozer and dependencies
      run: |
        pip3 install --upgrade pip wheel setuptools
        pip3 install buildozer==1.5.0 cython==0.29.33
        pip3 install kivy[base]==2.1.0
        
    - name: Build APK with native buildozer
      run: |
        export ANDROID_ACCEPT_SDK_LICENSE=1
        buildozer android debug --verbose
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-apk
        path: bin/*.apk
        
    - name: List built files
      if: always()
      run: |
        echo "Contents of bin directory:"
        ls -la bin/ || echo "bin directory not found"
        echo "Contents of current directory:"
        ls -la